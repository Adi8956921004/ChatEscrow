# Server
server.port=${SERVER_PORT:8080}
spring.application.name=chatescrow-backend
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Database configuration (defaults to H2 in-memory, supports PostgreSQL via SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:chatescrow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# CORS - configurable for production deployment
chatescrow.cors.allowed-origins=${CHATESCROW_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8443,http://localhost:3000,http://localhost:80,http://localhost}

# PayPal Sandbox - configure in .env or environment variables (never commit credentials here)
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
paypal.enable-payouts=${PAYPAL_ENABLE_PAYOUTS:false}

# AI provider - set AI_API_KEY in env
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-2.0-flash}
ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Logging
logging.level.com.chatescrow=INFO

# Spring Boot Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
