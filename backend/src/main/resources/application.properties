# Server
server.port=8080
spring.application.name=chatescrow-backend

# H2 in-memory database (hackathon demo — data resets on restart)
spring.datasource.url=jdbc:h2:mem:chatescrow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS - allow frontend dev server
chatescrow.cors.allowed-origins=http://localhost:5173,http://localhost:8443,http://localhost:3000

# PayPal Sandbox - set these in .env or system env vars (sandbox fallback defaults provided)
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:AYPBN9cgxIDTEpWaq1baqGAmMD7ySfFWFsIaJRYYlVZbN_3BiFOirvo0nQS_unZFx6jlCb43pVRO513U}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:ENvuCnuVfl262fb4AIQWNrNHOgC9BX1Kc968h_eIAksM50xMjzm_I8jXVIeKUolSfJDai8uWKOLCzUh3}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:2CF393810T184434G}
paypal.enable-payouts=${PAYPAL_ENABLE_PAYOUTS:false}

# AI provider - set AI_API_KEY in env
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-2.0-flash}
ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Logging
logging.level.com.chatescrow=INFO
