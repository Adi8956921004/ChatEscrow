version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5173}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:h2:mem:chatescrow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
      - CHATESCROW_CORS_ALLOWED_ORIGINS=${CHATESCROW_CORS_ALLOWED_ORIGINS:-*}
      - PAYPAL_BASE_URL=${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - PAYPAL_ENABLE_PAYOUTS=${PAYPAL_ENABLE_PAYOUTS:-false}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-2.0-flash}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional production PostgreSQL database
  # Run with: docker compose --profile postgres up
  postgres:
    image: postgres:16-alpine
    container_name: chatescrow-postgres
    environment:
      POSTGRES_DB: chatescrow
      POSTGRES_USER: ${POSTGRES_USER:-chatescrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatescrow_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - postgres

volumes:
  postgres_data:
